name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not redis_integration and not slow" --cov=sluice --cov-report=term-missing

  integration-compatibility:
    name: FastAPI/Redis compatibility (Python ${{ matrix.python-version }} / ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        dependencies: ["minimum", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install minimum supported runtime dependencies
        if: matrix.dependencies == 'minimum'
        run: >-
          python -m pip install --upgrade
          "fastapi==0.116.0"
          "redis[hiredis]==6.2.0"
          "cachetools==7.1.0"
      - run: >-
          python -m pytest -q
          tests/test_fastapi_dependency.py
          tests/test_policy.py
          tests/test_middleware_asgi.py
          tests/test_identity_security.py

  redis-integration:
    name: Redis integration (Python 3.12 / Redis 7.4)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      SLUICE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m redis_integration -q

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check sluice tests
      - name: Mypy baseline
        run: mypy sluice

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv "$RUNNER_TEMP/sluice-wheel-env"
      - run: >-
          "$RUNNER_TEMP/sluice-wheel-env/bin/python" -m pip install
          "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Import wheel and verify Lua resources in a clean environment
        run: >-
          "$RUNNER_TEMP/sluice-wheel-env/bin/python" -c
          'import importlib.metadata as m; import importlib.resources as r; import sluice; assert sluice.__version__ == m.version("sluice-limiter"); assert r.files("sluice").joinpath("scripts/token_bucket.lua").is_file(); assert r.files("sluice").joinpath("scripts/sliding_window_log.lua").is_file(); assert r.files("sluice").joinpath("scripts/sliding_window_counter.lua").is_file()'
        working-directory: ${{ runner.temp }}
