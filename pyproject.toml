[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice-limiter"
version = "0.1.3"
description = "FastAPI-first distributed rate limiting with Redis-backed algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Souvik Sarkar", email = "souviksarkar2k3@gmail.com" }
]

keywords = ["rate-limiting", "redis", "fastapi", "distributed", "lua"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "redis[hiredis]>=6.2,<8",
    "cachetools>=7.1,<8",
    "fastapi>=0.116,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "fakeredis[lua]>=2.31,<3",
    "httpx>=0.27,<0.29",
    "httpx2>=2,<3",
    "mypy>=1.13,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "uvicorn[standard]>=0.35,<1",
]
bench = [
    "matplotlib>=3.10",
    "numpy>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sluice*"]

[tool.setuptools.package-data]
sluice = ["py.typed", "scripts/*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "redis_integration: requires a live Redis service configured by SLUICE_TEST_REDIS_URL",
    "slow: longer-running tests excluded from the fast unit suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sluice", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["sluice"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
